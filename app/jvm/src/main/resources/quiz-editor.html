<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор квизов</title><link rel="stylesheet" href="/assets/editor/editor.css"></head><body><main><a href="/app/">← Вернуться к квизу</a><h1>Редактор квизов</h1><p>Квизы и загруженные файлы сохраняются в приватном репозитории GitHub.</p><p id="status" role="status"></p><label>Квиз <select id="quizzes"></select></label><button id="open" type="button">Открыть</button><hr><label>Имя файла <input id="name" placeholder="my-quiz.yml" autocomplete="off"></label><button id="new" type="button">Новый квиз</button><label>Содержание квиза в YAML<textarea id="yaml" spellcheck="false"></textarea></label><div><button id="save" type="button">Сохранить</button> <button id="activate" type="button">Запустить этот квиз</button></div><p>Запуск перезапустит приложение и сбросит текущие результаты игры.</p><hr><h2>Изображения и звуки</h2><label>Выберите файл <input type="file" id="media" accept="image/jpeg,image/png,image/gif,image/webp,audio/mpeg,audio/wav,audio/ogg,audio/mp4,video/webm"></label><button id="upload" type="button">Загрузить</button><p>Путь для поля image или audio: <code id="uploaded"></code></p></main><script src="/assets/editor/editor.js" defer></script></body></html>
